name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
jobs:
  test:
    # Parity tests: generator byte-identical to the W System API on 439 fixtures, validator rule ids / messages /
    # locations equal to the reference engine on the golden corpus, PDF/A-3b objects equal to the PHP SDK, parser output.
    # Windows also runs the suite on .NET Framework 4.8 (the netstandard2.0 build).
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x\n10.0.x"}
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Pack (NuGet package + symbols)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/WSystem.EInvoice -c Release -o artifacts
      - name: Package smoke test (fresh console app from the .nupkg)
        if: matrix.os == 'ubuntu-latest'
        run: tools/ci/package-smoke.sh artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with: {name: nupkg, path: artifacts/*}
  official-validators:
    # Every fixture the .NET generator produces is checked by independent official tools:
    # KoSIT validator (XRechnung 3.0.2 config bundled in this repo), veraPDF (PDF/A-3b) and Mustang (ZUGFeRD/Factur-X).
    # Verdicts must equal the W System reference engine's (tests/WSystem.EInvoice.Tests/fixtures/expected.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x\n10.0.x"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Download pinned validators
        run: |
          mkdir -p /tmp/tools
          curl -sfL -o /tmp/tools/kosit.jar https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
          curl -sfL -o /tmp/tools/mustang.jar https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar
          echo "799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9  /tmp/tools/kosit.jar" | sha256sum -c
          echo "42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736  /tmp/tools/mustang.jar" | sha256sum -c
          docker pull -q verapdf/cli:v1.30.4
      - run: dotnet run --project tools/Generate -c Release -- build/official
      - name: KoSIT validator on every XRechnung file
        run: tools/ci/kosit-check.sh build/official /tmp/tools/kosit.jar
      - name: veraPDF PDF/A-3b on every PDF
        run: |
          n=$(ls build/official/*.pdf | wc -l)
          docker run --rm -v "$PWD/build/official:/data" verapdf/cli:v1.30.4 --flavour 3b --format text /data > /tmp/vera.txt || true
          pass=$(grep -c '^PASS ' /tmp/vera.txt || true)
          echo "veraPDF: $pass / $n PASS"; grep -v '^PASS ' /tmp/vera.txt | head -20
          test "$pass" -eq "$n"
      - name: Mustang on every valid PDF
        run: tools/ci/mustang-check.sh build/official /tmp/tools/mustang.jar
  api-roundtrip:
    # Opt-in: sends three generated sample invoices to the W System API and compares its official verdict with the
    # local pre-check. Manual runs only (workflow_dispatch); uses the free keyless tier unless WSYSTEM_API_KEY is set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x\n10.0.x"}
      - run: dotnet test -c Release --filter "FullyQualifiedName~HttpValidatorTests.RoundTripWithApi"
        env:
          WSYSTEM_API_ROUNDTRIP: '1'
          WSYSTEM_API_KEY: ${{ secrets.WSYSTEM_API_KEY }}
